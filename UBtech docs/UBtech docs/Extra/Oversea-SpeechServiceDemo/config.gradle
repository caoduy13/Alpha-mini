ext {
    android = [compileSdkVersion: 28,
               buildToolsVersion: "28.0.3",
               minSdkVersion    : 19,
               targetSdkVersion : 28]

    sdk = [versionCode: 1,
           versionName: "0.0.1"]

    androidSupportVersion = [supportVer: "28.0.0"]

    thirdSupprotVersion = [mockitoVersion: "1.10.19",
                           junitVersion  : "4.12",
                           evetbusVersion: "3.0.0", okhttpVersion: "3.11.0",
                           okioVersion   : "2.1.0",]

    pluginVersion = [protocArtifact  : "3.4.0",
                     javaliteArtifact: "3.0.0",]

    plugin = [//----------------------ProtocolBuffer------------------
              protocArtifact  : "com.google.protobuf:protoc:${pluginVersion.protocArtifact}",
              javaliteArtifact: "com.google.protobuf:protoc-gen-javalite:${pluginVersion.javaliteArtifact}",]

    masterGroupId = 'com.ubtrobot.master'
    alphaGroupId = 'com.ubtrobot.lib.packets'

    depVersions = [//master          : '1.0.3',
                   master050         : '0.5.2-SNAPSHOT',
                   adapter           : '1.0.0-SNAPSHOT',
                   async             : '1.0.2',
                   ulog              : '1.0.0',
                   logmarker         : '1.0.0-SNAPSHOT',
                   commonsVersion    : '1.0.0-SNAPSHOT',
                   speechVersion     : '1.0.0-SNAPSHOT',
                   teachSpeechVersion: '1.0.0-SNAPSHOT',

                   okHttp            : '3.12.0',
                   gson              : '2.8.5',

                   //master
                   //speechSal       : '1.0.3-SNAPSHOT',
                   masterSpeechSal   : '1.0.0-SNAPSHOT',
                   speechDomain      : '1.0.2-SNAPSHOT',
                   google            : '3.0.0-SNAPSHOT',
                   tencent           : '1.0.0-SNAPSHOT',
                   ubtechNlp         : '3.0.0-SNAPSHOT',
                   weinaRecorder     : '4.0.0-SNAPSHOT',
                   vad               : "1.0.0-SNAPSHOT",

                   //alpha
                   utillib           : '1.2.8-SNAPSHOT',
                   motionSdk         : '0.2.4-SNAPSHOT',
                   servicecommon     : '0.0.4',
                   syseventsdk       : '1.1.0-SNAPSHOT',
                   expressdk         : '0.1.2-SNAPSHOT',
                   behaviorsdk       : '0.2.4-SNAPSHOT',
                   propertiessdk     : '0.0.2-SNAPSHOT',
                   voicesdk          : '0.0.9-SNAPSHOT',
                   standupsdk        : '0.1.6-SNAPSHOT',
                   settingsSdk       : '1.2-SNAPSHOT',

    ]

    deps = [//-------------------------------Android -----------------------------
            supportV4         : "com.android.support:support-v4:${androidSupportVersion.supportVer}",
            appCompatV7       : "com.android.support:appcompat-v7:${androidSupportVersion.supportVer}",
            design            : "com.android.support:design:${androidSupportVersion.supportVer}",
            cardviewV7        : "com.android.support:cardview-v7:${androidSupportVersion.supportVer}",
            supportAnnotations: "com.android.support:support-annotations:${androidSupportVersion.supportVer}",

            junit             : "junit:junit:${thirdSupprotVersion.junitVersion}",
            mockito           : "org.mockito:mockito-core:${thirdSupprotVersion.mockitoVersion}",

            scenelib          : 'com.ubtrobot.lib.packets:scene-lib:0.0.7-SNAPSHOT',
            actionhelper      : "com.ubtrobot.lib.packets:action:0.1.1-SNAPSHOT",
            master            : 'com.ubtrobot.master:master:0.5.0-SNAPSHOT',
            ulog              : 'com.ubtrobot.ulog:logger-android:0.0.2',
            servicecommon     : 'com.ubtrobot.lib.packets:services-common:0.0.4',
            voicesdk          : "com.ubtrobot.lib.packets:voice-sdk:0.0.9-SNAPSHOT",
            motionsdk         : "com.ubtrobot.lib.packets:motionsdk:0.2.4-SNAPSHOT",
            expresssdk        : "com.ubtrobot.lib.packets:express-sdk:0.1.2-SNAPSHOT",
            protobufparam     : 'com.ubtrobot.master:protobuf-param:0.5.0-SNAPSHOT',
            properties_sdk    : 'com.ubtrobot.lib.packets:mini_properties_sdk:0.0.2-SNAPSHOT',
            LightService      : 'com.ubtrobot.lib.packets:ledsdk:0.1.1-SNAPSHOT',
            utillib           : "com.ubtrobot.lib.packets:utillib:1.2.7",
            rosaAnalytics     : 'com.ubtrobot.framework:analytics:0.7.3-SNAPSHOT',
            ubtGsonParam      : "com.ubtrobot.master:gson-param:0.3.0-SNAPSHOT",
            behivarcfg        : 'com.ubtrobot.lib.packets:behavior-lib:0.2.1-SNAPSHOT',
            eventbus          : "org.greenrobot:eventbus:${thirdSupprotVersion.evetbusVersion}",
            standupsdk        : 'com.ubtrobot.lib.packets:standupsdk:0.1.6-SNAPSHOT',
            speechsdk         : 'com.ubtrobot.lib.packets:speechsdk:0.3.4-SNAPSHOT',
            syseventsdk       : 'com.ubtrobot.lib.packets:syseventsdk:1.1.0-SNAPSHOT',
            properties_sdk    : 'com.ubtrobot.lib.packets:mini_properties_sdk:0.0.2-SNAPSHOT',
            okhttp            : "com.squareup.okhttp3:okhttp:${thirdSupprotVersion.okhttpVersion}",
            okio              : "com.squareup.okio:okio:${thirdSupprotVersion.okioVersion}",
            gson              : 'com.google.code.gson:gson:2.7',


            weinaRecorder : "$masterGroupId:weina-recorder:${depVersions.weinaRecorder}",
            tencentWakeup : "$masterGroupId:impl-wakeup-dingdang:${depVersions.tencent}",
            sal_speech    : "$masterGroupId:sal-speech:${depVersions.masterSpeechSal}",
            speech        : "$masterGroupId:speech:${depVersions.masterSpeechSal}",
            ulogAndroid   : "com.ubtrobot.ulog:logger-android:${depVersions.ulog}",
            coreCommons   : "$masterGroupId:core-commons:${depVersions.commonsVersion}",
            logmarker     : "$masterGroupId:log-marker:${depVersions.logmarker}",
            teachSpeech   : "$masterGroupId:teach-speech-sdk:${depVersions.speechVersion}",
    ]
}