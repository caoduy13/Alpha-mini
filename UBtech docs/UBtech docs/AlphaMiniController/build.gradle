buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Dùng Android Gradle Plugin 4.2.2 để tương thích Java 8
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
